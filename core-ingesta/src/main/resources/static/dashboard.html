<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calidad del Aire — Panel en Tiempo Real</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<header>
  <h1>Calidad del Aire — Panel en Tiempo Real</h1>
  <div class="status">
    <span class="status-dot" id="connDot"></span>
    <span id="connLabel">Conectando…</span>
  </div>
</header>

<div class="layout">
  <main>
    <div class="stat-row" id="statRow">
      <div class="stat-card">
        <div class="label">CO2</div>
        <div class="value">— <span class="unit">ppm</span></div>
      </div>
      <div class="stat-card">
        <div class="label">PM2.5</div>
        <div class="value">— <span class="unit">µg/m³</span></div>
      </div>
      <div class="stat-card">
        <div class="label">PM10</div>
        <div class="value">— <span class="unit">µg/m³</span></div>
      </div>
      <div class="stat-card">
        <div class="label">Nivel de riesgo</div>
        <div class="value"><span class="risk-badge" id="riskBadge">—</span></div>
      </div>
    </div>


    <div class="card">
      <h2>Histórico (últimas 24h) — <span id="filtroHistorico" style="color:var(--text-secondary); font-weight:400;">general</span></h2>
      <div class="chart-wrap">
        <canvas id="historicoChart" role="img" aria-label="Histórico de CO2, PM2.5 y PM10 de las últimas 24 horas"></canvas>
      </div>
    </div>



    <div class="card">
      <h2>Tendencia reciente — <span id="filtroActual" style="color:var(--text-secondary); font-weight:400;">general</span></h2>
      <div class="legend">
        <span><i style="background:#2a78d6"></i>CO2</span>
        <span><i style="background:#eb6834"></i>PM2.5</span>
        <span><i style="background:#1baf7a"></i>PM10</span>
      </div>
      <div class="chart-wrap">
        <canvas id="trendChart" role="img" aria-label="Tendencia de CO2, PM2.5 y PM10 en las lecturas recientes"></canvas>
      </div>
    </div>
  </main>

  <aside>
    <div class="card">
      <h2>Alertas recientes</h2>
      <div id="alertsList"><div class="empty">Sin alertas todavía</div></div>
    </div>
    <div class="card">
      <h2>Nodos</h2>
      <div id="nodesList"><div class="empty">Cargando nodos…</div></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
